<!doctype html>
<html>
  <body>
    <div
      style='background-color:#F2F5F7;color:#242424;font-family:"Helvetica Neue", "Arial Nova", "Nimbus Sans", Arial, sans-serif;font-size:16px;font-weight:400;letter-spacing:0.15008px;line-height:1.5;margin:0;padding:32px 0;min-height:100%;width:100%'
    >
      <table
        align="center"
        width="100%"
        style="margin:0 auto;max-width:600px;background-color:#FFFFFF"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tbody>
          <tr style="width:100%">
            <td>
              <div style="padding:24px 24px 24px 24px;text-align:center">
                <!-- Logo with multiple fallback options for Gmail compatibility -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                  <tr>
                    <td align="center">
                      <a
                        href="https://gdgdavao.org"
                        style="text-decoration:none;display:inline-block;"
                        target="_blank"
                      >
                        <img
                          alt="TeamApo Hub Logo"
                          src="https://cdn.jsdelivr.net/gh/gdgdavao/assets-cdn@main/apohub-title.png"
                          width="512"
                          height="64"
                          style="width:256px;height:64px;outline:none;border:none;text-decoration:none;vertical-align:middle;display:block;max-width:100%;"
                          border="0"
                        />
                        <!--[if !mso]><!-->
                        <!-- Fallback for email clients that don't support images -->
                        <div style="display:none;font-size:0;line-height:0;max-height:0;max-width:0;overflow:hidden;">
                          <h1 style="color:#4285f4;font-size:24px;font-weight:bold;text-align:center;margin:20px 0;font-family:Arial,sans-serif;">
                            TeamApo Hub - GDG Davao
                          </h1>
                        </div>
                        <!--<![endif]-->
                      </a>
                    </td>
                  </tr>
                </table>
              </div>
              <div style="height:16px"></div>
              <div
                style='font-size:30px;font-family:"Nimbus Mono PS", "Courier New", "Cutive Mono", monospace;font-weight:bold;padding:16px 24px 16px 24px'
              >
                Hi {{user_name}} 👋
              </div>
              <div
                style="font-size:15px;font-weight:normal;padding:16px 24px 16px 24px"
              >
                {{content}}
              </div>
              <div style="padding:16px 0px 16px 0px">
                <hr
                  style="width:100%;border:none;border-top:1px solid #CCCCCC;margin:0"
                />
              </div>
              <div
                style="font-size:15px;font-weight:normal;padding:16px 24px 16px 24px"
              >
                {{footer_content}}
              </div>
              <div style="height:16px"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
