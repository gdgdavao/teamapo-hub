<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Google Developer Groups - Davao</title>
    <!--[if mso]>
    <noscript>
      <xml>
        <o:OfficeDocumentSettings>
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    </noscript>
    <![endif]-->
    <style type="text/css">
      :root {
        color-scheme: light only;
        supported-color-schemes: light only;
      }
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
      body { margin: 0; padding: 0; width: 100% !important; min-width: 100%; background-color: #f8fafd !important; color: #1f1f1f !important; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

      /* Defensive overrides against email client dark-mode color inversion */
      @media (prefers-color-scheme: dark) {
        body, .email-bg, [data-ogsc] {
          background-color: #f8fafd !important;
          color: #1f1f1f !important;
        }
        .card-container, [data-ogsc] .card-container {
          background-color: #ffffff !important;
          border-color: #dadce0 !important;
          color: #1f1f1f !important;
        }
        h1, h2, h3, h4, p, span, td, div {
          color: #1f1f1f !important;
        }
      }
    </style>
  </head>
  <body class="email-body" style="margin:0;padding:0;background-color:#f8fafd;color:#1f1f1f;font-family:'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;-webkit-font-smoothing:antialiased;">
    <div class="email-bg" style="background-color:#f8fafd;margin:0;padding:36px 12px;min-height:100%;width:100%;">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="width:600px;">
        <tr>
          <td align="center" valign="top">
      <![endif]-->
      <table
        class="card-container"
        align="center"
        width="100%"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin:0 auto;max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;border:1px solid #dadce0;overflow:hidden;border-collapse:separate;"
      >
        <tbody>
          <!-- Google 4-Color Accent Bar (Top of Card) -->
          <tr>
            <td style="padding:0;line-height:0;font-size:0;border-top-left-radius:15px;border-top-right-radius:15px;overflow:hidden;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;height:3px;border-collapse:collapse;">
                <tr>
                  <td width="25%" style="background-color:#4285f4;height:3px;font-size:0;line-height:0;">&nbsp;</td>
                  <td width="25%" style="background-color:#ea4335;height:3px;font-size:0;line-height:0;">&nbsp;</td>
                  <td width="25%" style="background-color:#fbbc04;height:3px;font-size:0;line-height:0;">&nbsp;</td>
                  <td width="25%" style="background-color:#34a853;height:3px;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Centered GDG Davao Logo Header -->
          <tr>
            <td align="center" style="padding:24px 20px 18px 20px;background-color:#ffffff;text-align:center;">
              <a
                href="https://gdgdavao.org"
                target="_blank"
                style="display:inline-block;text-decoration:none;outline:none;border:none;"
              >
                <img
                  src="https://assets.gdgdavao.org/email-assets/gdgdvo-header-mail.png"
                  alt="Google Developer Group Davao"
                  width="235"
                  style="display:block;width:235px;max-width:100%;height:auto;margin:0 auto;border:0;outline:none;text-decoration:none;"
                />
              </a>
            </td>
          </tr>
          <!-- Main Email Content Area -->
          <tr>
            <td style="padding:32px 32px 28px 32px;text-align:left;">
              <h1
                style="margin:0 0 18px 0;font-family:'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:22px;font-weight:600;line-height:1.3;color:#1f1f1f;letter-spacing:-0.01em;"
              >
                Hi {{user_name}},
              </h1>
              <div
                style="font-family:Roboto, 'Google Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:15px;font-weight:400;line-height:1.6;color:#1f1f1f;"
              >
                {{content}}
              </div>
              <div style="padding:24px 0 20px 0;">
                <hr
                  style="width:100%;border:none;border-top:1px solid #dadce0;margin:0;"
                />
              </div>
              <div
                style="font-family:Roboto, 'Google Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-size:12px;line-height:1.5;color:#5f6368;"
              >
                {{footer_content}}
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <!--[if (gte mso 9)|(IE)]>
          </td>
        </tr>
      </table>
      <![endif]-->
    </div>
  </body>
</html>
