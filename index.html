<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GDG Davao | Google Developer Groups - Davao" />
    <title>GDG Davao | Google Developer Groups - Davao</title>
    <script>
      (function() {
        var host = window.location.hostname;
        var isApohub = host === 'apohub.localhost' || host.indexOf('apohub.') === 0;
        if (isApohub) {
          document.title = 'TeamApo Hub | Google Developer Groups - Davao';
          var link = document.querySelector('link[rel="icon"]');
          if (link) {
            link.setAttribute('href', '/apohub-logo.svg');
          } else {
            var newLink = document.createElement('link');
            newLink.setAttribute('rel', 'icon');
            newLink.setAttribute('href', '/apohub-logo.svg');
            document.head.appendChild(newLink);
          }
        }
      })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
